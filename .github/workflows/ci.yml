name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/validate-skill.js
      - run: node tests/smoke-test.js
        env:
          PPTX_TEST_PYTHON: python3
      - run: python3 -m py_compile scripts/*.py
